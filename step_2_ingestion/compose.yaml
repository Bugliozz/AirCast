services:

  mysql:
    image: mysql:8.0
    container_name: exam_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: airquality
      MYSQL_USER: airuser
      MYSQL_PASSWORD: airpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: exam_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: airquality
      MB_DB_PORT: 3306
      MB_DB_USER: airuser
      MB_DB_PASS: airpass
      MB_DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    container_name: exam_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
