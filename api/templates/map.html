{% extends "base.html" %}
{% set active_page = 'map' %}
{% block title %}Alert Map - PM10 Forecast Lombardy{% endblock %}

{% block content %}
  <div class="map-header mb-3">
    <h1 class="h3 mb-0">PM10 alert map - tomorrow</h1>
    <div class="alert-legend mt-2" aria-label="PM10 alert legend">
      <span
        class="alert-legend-item alert-verde"
        tabindex="0"
        data-bs-toggle="tooltip"
        title="Green: PM10 forecast below 20 ug/m3"
      >green</span>
      <span
        class="alert-legend-item alert-giallo"
        tabindex="0"
        data-bs-toggle="tooltip"
        title="Yellow: PM10 forecast from 20 to 35 ug/m3"
      >yellow</span>
      <span
        class="alert-legend-item alert-arancione"
        tabindex="0"
        data-bs-toggle="tooltip"
        title="Orange: PM10 forecast from 35 to 50 ug/m3"
      >orange</span>
      <span
        class="alert-legend-item alert-rosso"
        tabindex="0"
        data-bs-toggle="tooltip"
        title="Red: PM10 forecast at or above 50 ug/m3"
      >red</span>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0" style="height: 70vh;">
      <iframe
        srcdoc="{{ map_html|e }}"
        style="width: 100%; height: 100%; border: 0;"
        title="PM10 alert map for Lombardy"
      ></iframe>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
      new bootstrap.Tooltip(el);
    });
  </script>
{% endblock %}
